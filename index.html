<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>品书生成器 / 品書きメーカー</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="styles/canvas.css">
<link rel="stylesheet" href="styles/app.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">品</span>
      <div class="brand-text">
        <span class="brand-title" data-i18n="app.title"></span>
        <span class="brand-sub" data-i18n="app.subtitle"></span>
      </div>
    </div>

    <div class="topbar-actions">
      <button class="icon-btn" id="btn-undo" type="button" data-i18n-title="top.undo">&#8630;</button>
      <button class="icon-btn" id="btn-redo" type="button" data-i18n-title="top.redo">&#8631;</button>

      <span class="zoom-wrap">
        <select id="zoom-select" data-i18n-title="top.zoom">
          <option value="fit" data-i18n="zoom.fit"></option>
          <option value="100" data-i18n="zoom.100"></option>
          <option value="75" data-i18n="zoom.75"></option>
          <option value="50" data-i18n="zoom.50"></option>
        </select>
        <span class="zoom-info" id="zoom-info"></span>
      </span>

      <button class="icon-btn" id="btn-grid" type="button" aria-pressed="false"
              data-i18n-title="top.grid">&#9638;</button>

      <span class="chip" id="overflow-chip" hidden></span>
      <button class="btn" id="btn-fit" type="button" data-i18n="top.fit" hidden></button>

      <button class="btn" id="btn-lang" type="button" data-i18n="lang.toggle"></button>
      <button class="btn primary" id="btn-export" type="button" data-i18n="top.export"></button>
      <span class="save-status" id="save-status"></span>
    </div>
  </header>

  <div class="workbench">

    <aside class="col col-left">
      <div class="col-head">
        <span data-i18n="outline.title"></span>
        <span class="col-hint" data-i18n="outline.hint"></span>
      </div>
      <div class="col-body" id="outline"></div>
    </aside>

    <main class="col col-center">
      <div class="pane" id="canvas-pane">
        <div class="stage" id="stage">
          <div class="canvas" id="canvas">
            <canvas class="decor-layer" id="decor"></canvas>
            <div class="canvas-stack" id="canvas-stack"></div>
          </div>
        </div>
      </div>
      <div class="busy" id="busy" hidden>
        <div class="busy-box">
          <div class="spinner"></div>
          <span id="busy-text"></span>
          <div class="busy-track"><div id="busy-bar"></div></div>
        </div>
      </div>
    </main>

    <aside class="col col-right">
      <div class="col-head" id="inspector-head">
        <span data-i18n="panel.global"></span>
      </div>
      <div class="col-body" id="inspector"></div>
    </aside>

  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <h3 id="modal-title"></h3>
    <ul id="modal-list"></ul>
    <div class="modal-actions">
      <button class="btn" id="modal-cancel" type="button"></button>
      <button class="btn primary" id="modal-ok" type="button"></button>
    </div>
  </div>
</div>

<script src="vendor/html2canvas.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
